<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexical Scoping in JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #wrap {
            width: 1920px;
            height: 1080px;
            transform-origin: top center;
            position: relative
        }

        canvas {
            display: block;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .08)
        }

        #bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, .97);
            backdrop-filter: blur(14px);
            border-top: 1px solid #e5e7eb;
            padding: 14px 24px;
            z-index: 200;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, .05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .b {
            padding: 12px 36px;
            border: none;
            border-radius: 10px;
            font: 600 15px/1 'Segoe UI', system-ui, sans-serif;
            cursor: pointer;
            transition: all .15s;
            user-select: none;
        }

        .b:active {
            transform: scale(.96)
        }

        #prev {
            background: #e5e7eb;
            color: #374151
        }

        #prev:hover {
            background: #d1d5db
        }

        #next {
            background: #2563EB;
            color: #fff
        }

        #next:hover {
            background: #1d4ed8
        }

        #info {
            font: 600 14px/1.3 'Segoe UI', system-ui, sans-serif;
            color: #374151;
            min-width: 360px;
            text-align: center;
            padding: 8px 20px;
            background: #f3f4f6;
            border-radius: 8px;
        }

        #info .n {
            color: #2563EB
        }

        .keys {
            font: 400 12px 'Segoe UI', system-ui, sans-serif;
            color: #9ca3af
        }
    </style>
</head>

<body>
    <div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
    <div id="bar">
        <button class="b" id="prev">◀ Back</button>
        <div id="info"><span class="n">1</span> / 14 — Ready</div>
        <button class="b" id="next">Next ▶</button>
        <div class="keys">← → arrow keys</div>
    </div>

    <script>
        const cv = document.getElementById('c'), X = cv.getContext('2d'), W = 1920, H = 1080;

        function fit() {
            const s = Math.min(window.innerWidth / W, (window.innerHeight - 80) / H, 1);
            document.getElementById('wrap').style.transform = `scale(${s})`;
        }
        fit(); window.addEventListener('resize', fit);

        const C = {
            bg: '#ffffff', tx: '#1f2937', md: '#4b5563', lt: '#9ca3af',
            blue: '#2563EB', blueD: '#1e40af', blueL: '#dbeafe',
            green: '#10b981', greenD: '#065f46', greenL: '#d1fae5',
            red: '#ef4444', redD: '#b91c1c', redL: '#fee2e2',
            orange: '#f97316', orangeD: '#c2410c', orangeL: '#fff7ed',
            purple: '#7c3aed', purpleD: '#5b21b6', purpleL: '#ede9fe',
            teal: '#0d9488', tealD: '#115e59', tealL: '#ccfbf1',
            amber: '#d97706', amberL: '#fef3c7',
            gb: '#e5e7eb', gg: '#f3f4f6',
            pink: '#ec4899', pinkL: '#fce7f3',
        };

        const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
        const eOut = t => 1 - Math.pow(1 - t, 3);
        const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const eBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) };
        const eElastic = t => { if (!t || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * 2 * Math.PI / 3) + 1 };
        const pulse = () => .5 + .5 * Math.sin(performance.now() * .004);
        const now = () => performance.now();

        const STEPS = [
            { id: 0, label: 'Title & Introduction' },
            { id: 1, label: 'Show the Code' },
            { id: 2, label: 'Show Scope Layout' },
            { id: 3, label: 'Execution enters wrapper()' },
            { id: 4, label: 'wrapper() calls greet()' },
            { id: 5, label: 'Key Insight: Lexical Scope' },
            { id: 6, label: 'greet() looks up "name"' },
            { id: 7, label: 'Skip wrapper() — not lexical parent' },
            { id: 8, label: 'Arrow to Global Scope' },
            { id: 9, label: 'Found: name = "Global"' },
            { id: 10, label: 'Output: Hello, Global' },
            { id: 11, label: 'Why? — Explanation' },
            { id: 12, label: 'Lexical vs Dynamic Comparison' },
            { id: 13, label: 'Key Takeaways' },
        ];
        let step = 0, anim = 0;
        const AD = 550;

        function setStep(s) {
            s = clamp(s, 0, STEPS.length - 1);
            if (s === step) return;
            step = s; anim = 0;
            document.getElementById('info').innerHTML =
                `<span class="n">${step + 1}</span> / ${STEPS.length} — ${STEPS[step].label}`;
        }
        document.getElementById('next').onclick = () => setStep(step + 1);
        document.getElementById('prev').onclick = () => setStep(step - 1);
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); setStep(step + 1) }
            if (e.key === 'ArrowLeft') { e.preventDefault(); setStep(step - 1) }
        });
        setStep(0);

        /* ═══ draw helpers ═══ */
        function rr(x, y, w, h, r) {
            X.beginPath(); X.moveTo(x + r, y); X.lineTo(x + w - r, y);
            X.quadraticCurveTo(x + w, y, x + w, y + r); X.lineTo(x + w, y + h - r);
            X.quadraticCurveTo(x + w, y + h, x + w - r, y + h); X.lineTo(x + r, y + h);
            X.quadraticCurveTo(x, y + h, x, y + h - r); X.lineTo(x, y + r);
            X.quadraticCurveTo(x, y, x + r, y); X.closePath();
        }
        function dashedArrow(fx, fy, tx, ty, col, a, lw = 3) {
            X.save(); X.globalAlpha = a; X.strokeStyle = col; X.fillStyle = col; X.lineWidth = lw;
            X.setLineDash([10, 7]); X.lineDashOffset = -now() * .03;
            X.beginPath(); X.moveTo(fx, fy); X.lineTo(tx, ty); X.stroke();
            X.setLineDash([]);
            const an = Math.atan2(ty - fy, tx - fx), hl = 14;
            X.beginPath(); X.moveTo(tx, ty);
            X.lineTo(tx - hl * Math.cos(an - Math.PI / 7), ty - hl * Math.sin(an - Math.PI / 7));
            X.lineTo(tx - hl * Math.cos(an + Math.PI / 7), ty - hl * Math.sin(an + Math.PI / 7));
            X.closePath(); X.fill(); X.restore();
        }
        function curvedDashedArrow(fx, fy, tx, ty, cx1, cy1, cx2, cy2, col, a, lw = 3) {
            X.save(); X.globalAlpha = a; X.strokeStyle = col; X.fillStyle = col; X.lineWidth = lw;
            X.setLineDash([10, 7]); X.lineDashOffset = -now() * .03;
            X.beginPath(); X.moveTo(fx, fy); X.bezierCurveTo(cx1, cy1, cx2, cy2, tx, ty); X.stroke();
            X.setLineDash([]);
            const dx = tx - cx2, dy = ty - cy2;
            const an = Math.atan2(dy, dx), hl = 14;
            X.beginPath(); X.moveTo(tx, ty);
            X.lineTo(tx - hl * Math.cos(an - Math.PI / 7), ty - hl * Math.sin(an - Math.PI / 7));
            X.lineTo(tx - hl * Math.cos(an + Math.PI / 7), ty - hl * Math.sin(an + Math.PI / 7));
            X.closePath(); X.fill(); X.restore();
        }
        function glow(x, y, w, h, col, i) {
            X.save(); X.shadowColor = col; X.shadowBlur = 24 * i;
            X.fillStyle = col + '15'; rr(x - 3, y - 3, w + 6, h + 6, 12); X.fill(); X.restore();
        }
        function badge(x, y, txt, bg, fg, a, align = 'left') {
            X.save(); X.globalAlpha = a;
            X.font = '700 13px "Segoe UI",system-ui,sans-serif';
            const tw = X.measureText(txt).width + 22;
            const bx = align === 'center' ? x - tw / 2 : x;
            X.fillStyle = bg; rr(bx, y - 13, tw, 26, 6); X.fill();
            X.fillStyle = fg; X.textAlign = 'left'; X.fillText(txt, bx + 11, y + 5);
            X.restore();
        }

        /* ═══ TITLE AREA ═══ */
        const TITLE_BOTTOM = 110; // title + subtitle + line ends here

        /* ═══ LAYOUT CONSTANTS ═══ */
        // All scope content lives below the title area
        const SCOPE_TOP = 130;     // top of global scope box
        const CODE_TOP = 135;      // top of code panel

        /* ═══ CODE PANEL ═══ */
        function drawCode() {
            const cx = 60, cy = CODE_TOP, cw = 530, ch = 480;
            X.fillStyle = '#f8fafc'; X.strokeStyle = C.gb; X.lineWidth = 1;
            rr(cx, cy, cw, ch, 14); X.fill(); X.stroke();
            X.fillStyle = C.gg; rr(cx, cy, cw, 42, 14); X.fill(); X.fillRect(cx, cy + 30, cw, 12);
            X.strokeStyle = C.gb; X.beginPath(); X.moveTo(cx, cy + 42); X.lineTo(cx + cw, cy + 42); X.stroke();
            ['#ef4444', '#f59e0b', '#22c55e'].forEach((c, i) => {
                X.fillStyle = c; X.beginPath(); X.arc(cx + 22 + i * 22, cy + 21, 6, 0, Math.PI * 2); X.fill()
            });
            X.font = '500 13px "Segoe UI"'; X.fillStyle = C.lt; X.textAlign = 'center';
            X.fillText('lexical-scope.js', cx + cw / 2, cy + 26);

            const mono = '500 15px "SF Mono","Fira Code",Consolas,monospace';
            const lines = [
                [{ t: 'let ', c: C.blue }, { t: 'name', c: C.orange }, { t: ' = ', c: C.tx }, { t: '"Global"', c: '#059669' }, { t: ';', c: C.tx }],
                [],
                [{ t: 'function ', c: C.blue }, { t: 'greet', c: C.purple }, { t: '() {', c: C.tx }],
                [{ t: '    console', c: C.purple }, { t: '.', c: C.tx }, { t: 'log', c: C.blue }, { t: '(', c: C.tx }, { t: '"Hello, "', c: '#059669' }, { t: ' + name);', c: C.tx }],
                [{ t: '}', c: C.tx }],
                [],
                [{ t: 'function ', c: C.blue }, { t: 'wrapper', c: C.teal }, { t: '() {', c: C.tx }],
                [{ t: '    let ', c: C.blue }, { t: 'name', c: C.orange }, { t: ' = ', c: C.tx }, { t: '"Wrapper"', c: '#059669' }, { t: ';', c: C.tx }],
                [{ t: '    greet', c: C.purple }, { t: '();', c: C.tx }],
                [{ t: '}', c: C.tx }],
                [],
                [{ t: 'wrapper', c: C.teal }, { t: '();', c: C.tx }],
            ];

            X.font = mono; X.textAlign = 'left';
            lines.forEach((toks, i) => {
                const ly = cy + 70 + i * 32;
                X.fillStyle = '#bcc0c7'; X.font = '400 12px "SF Mono",Consolas,monospace';
                X.fillText(String(i + 1).padStart(2, ' '), cx + 12, ly + 5);
                X.font = mono;
                let tx2 = cx + 44;
                toks.forEach(tok => { X.fillStyle = tok.c; X.fillText(tok.t, tx2, ly + 5); tx2 += X.measureText(tok.t).width });
            });

            const hls = [];
            if (step === 3) hls.push({ line: 6, col: C.teal }, { line: 7, col: C.teal });
            if (step === 4 || step === 5) hls.push({ line: 8, col: C.purple });
            if (step >= 6 && step <= 9) hls.push({ line: 3, col: C.orange });
            if (step === 9 || step === 10) hls.push({ line: 0, col: C.green });
            if (step === 7) hls.push({ line: 7, col: C.red });

            hls.forEach(h => {
                const ly = cy + 70 + h.line * 32;
                X.save(); X.globalAlpha = .12 + .06 * pulse();
                X.fillStyle = h.col; rr(cx + 6, ly - 12, cw - 12, 30, 5); X.fill();
                X.restore();
                X.save(); X.globalAlpha = .55; X.strokeStyle = h.col; X.lineWidth = 1.5;
                rr(cx + 6, ly - 12, cw - 12, 30, 5); X.stroke(); X.restore();
            });
        }

        /* ═══ SCOPE BOXES ═══ */
        function drawScopes(a2) {
            const gx = 640, gy = SCOPE_TOP, gw = 1220, gh = 860;
            const gActive = step >= 8 && step <= 9;
            const gFound = step >= 9 && step <= 10;

            X.save(); X.globalAlpha = a2;
            if (gActive) glow(gx, gy, gw, gh, C.blue, .5 + .3 * pulse());
            X.fillStyle = C.blueL + '50'; X.strokeStyle = gActive ? C.blue : C.blue + '80'; X.lineWidth = gActive ? 3 : 2;
            rr(gx, gy, gw, gh, 18); X.fill(); X.stroke();

            // Global label
            X.fillStyle = C.blue; rr(gx + 16, gy + 14, 145, 32, 8); X.fill();
            X.font = '700 14px "Segoe UI"'; X.fillStyle = '#fff'; X.textAlign = 'left'; X.fillText('Global Scope', gx + 28, gy + 36);

            // Global variable pill
            const vbx = gx + 180, vby = gy + 16;
            X.fillStyle = '#fff'; X.strokeStyle = gFound ? C.green : C.blue + '50'; X.lineWidth = gFound ? 2.5 : 1;
            rr(vbx, vby, 220, 28, 6); X.fill(); X.stroke();
            if (gFound) { glow(vbx, vby, 220, 28, C.green, .6 + .3 * pulse()) }
            X.font = '600 14px "SF Mono",Consolas,monospace'; X.textAlign = 'left';
            X.fillStyle = C.blue; X.fillText('name', vbx + 10, vby + 19);
            X.fillStyle = C.md; X.fillText(' = ', vbx + 10 + X.measureText('name').width, vby + 19);
            X.fillStyle = '#059669'; X.fillText('"Global"', vbx + 10 + X.measureText('name = ').width, vby + 19);

            // ─── greet() box ───
            const grX = gx + 40, grY = gy + 70, grW = 540, grH = 340;
            const grSearch = step === 6;

            if (grSearch) glow(grX, grY, grW, grH, C.purple, .4 + .3 * pulse());
            X.fillStyle = C.purpleL + '40'; X.strokeStyle = grSearch ? C.purple : C.purple + '70'; X.lineWidth = grSearch ? 3 : 2;
            rr(grX, grY, grW, grH, 14); X.fill(); X.stroke();

            X.fillStyle = C.purple; rr(grX + 14, grY + 12, 195, 30, 7); X.fill();
            X.font = '700 13px "Segoe UI"'; X.fillStyle = '#fff'; X.textAlign = 'left';
            X.fillText('greet() — Function Scope', grX + 24, grY + 33);

            badge(grX + 220, grY + 26, '📍 Defined in Global Scope', C.purpleL, C.purpleD, a2);

            // console.log inside greet
            const clx = grX + 30, cly = grY + 60;
            X.fillStyle = '#fff'; X.strokeStyle = C.purple + '50'; X.lineWidth = 1;
            rr(clx, cly, 380, 40, 8); X.fill(); X.stroke();
            X.font = '500 15px "SF Mono","Fira Code",Consolas,monospace'; X.textAlign = 'left';
            X.fillStyle = C.purple; X.fillText('console', clx + 12, cly + 26);
            X.fillStyle = C.tx; X.fillText('.', clx + 12 + X.measureText('console').width, cly + 26);
            X.fillStyle = C.blue; X.fillText('log', clx + 12 + X.measureText('console.').width, cly + 26);
            X.fillStyle = C.tx; X.fillText('("Hello, "+name)', clx + 12 + X.measureText('console.log').width, cly + 26);

            // Search indicator
            if (step === 6) {
                const sa = eOut(anim);
                X.save(); X.globalAlpha = sa;
                X.font = '600 15px "Segoe UI"'; X.fillStyle = C.purple; X.textAlign = 'center';
                X.fillText('🔍 Looking for "name" here...', grX + grW / 2, grY + 140);
                X.fillStyle = C.purpleL; rr(grX + 60, grY + 155, grW - 120, 36, 8); X.fill();
                X.font = '500 14px "Segoe UI"'; X.fillStyle = C.purpleD;
                X.fillText('No local "name" variable found', grX + grW / 2, grY + 179);
                X.restore();
            }

            // Lexical insight inside greet
            if (step === 7 || step === 8) {
                X.save(); X.globalAlpha = step === 7 ? eOut(anim) : 1;
                X.fillStyle = C.amberL; X.strokeStyle = C.amber + '60'; X.lineWidth = 1.5;
                rr(grX + 30, grY + 200, grW - 60, 110, 10); X.fill(); X.stroke();
                X.font = '600 15px "Segoe UI"'; X.fillStyle = C.amber; X.textAlign = 'center';
                X.fillText('💡 Key Insight: Lexical Scoping', grX + grW / 2, grY + 228);
                X.font = '400 14px "Segoe UI"'; X.fillStyle = C.orangeD;
                X.fillText('Scope is determined where the function', grX + grW / 2, grY + 254);
                X.font = '700 14px "Segoe UI"';
                X.fillText('is WRITTEN, not where it is CALLED.', grX + grW / 2, grY + 276);
                X.font = '400 13px "Segoe UI"'; X.fillStyle = C.md;
                X.fillText('greet() is written in Global → looks in Global next', grX + grW / 2, grY + 298);
                X.restore();
            }

            // ─── wrapper() box ───
            const wX = gx + 640, wY = gy + 70, wW = 540, wH = 340;
            const wActive = step >= 3 && step <= 4;
            const wCrossed = step >= 7;

            if (wActive) glow(wX, wY, wW, wH, C.teal, .4 + .3 * pulse());
            X.fillStyle = C.tealL + '40'; X.strokeStyle = wActive ? C.teal : (wCrossed ? C.red + '40' : C.teal + '70');
            X.lineWidth = wActive ? 3 : 2;
            rr(wX, wY, wW, wH, 14); X.fill(); X.stroke();

            X.fillStyle = C.teal; rr(wX + 14, wY + 12, 220, 30, 7); X.fill();
            X.font = '700 13px "Segoe UI"'; X.fillStyle = '#fff'; X.textAlign = 'left';
            X.fillText('wrapper() — Function Scope', wX + 24, wY + 33);

            // wrapper's variable
            const wvx = wX + 30, wvy = wY + 58;
            X.fillStyle = '#fff';
            X.strokeStyle = wCrossed ? C.red + '40' : C.teal + '50'; X.lineWidth = 1;
            rr(wvx, wvy, 260, 34, 7); X.fill(); X.stroke();
            X.font = '600 14px "SF Mono",Consolas,monospace'; X.textAlign = 'left';

            if (wCrossed) {
                X.save(); X.globalAlpha = .35;
                X.fillStyle = C.md; X.fillText('name = "Wrapper"', wvx + 12, wvy + 23);
                const tw3 = X.measureText('name = "Wrapper"').width;
                X.strokeStyle = C.red; X.lineWidth = 2;
                X.beginPath(); X.moveTo(wvx + 8, wvy + 17); X.lineTo(wvx + 16 + tw3, wvy + 17); X.stroke();
                X.restore();
            } else {
                X.fillStyle = C.teal; X.fillText('name', wvx + 12, wvy + 23);
                X.fillStyle = C.md; X.fillText(' = ', wvx + 12 + X.measureText('name').width, wvy + 23);
                X.fillStyle = '#059669'; X.fillText('"Wrapper"', wvx + 12 + X.measureText('name = ').width, wvy + 23);
            }

            // greet() call inside wrapper
            const gcx = wX + 30, gcy = wY + 110;
            X.fillStyle = '#fff'; X.strokeStyle = (step === 4) ? C.purple + '90' : C.teal + '40'; X.lineWidth = (step === 4) ? 2 : 1;
            rr(gcx, gcy, 200, 36, 7); X.fill(); X.stroke();
            X.font = '500 15px "SF Mono","Fira Code",Consolas,monospace'; X.textAlign = 'left';
            X.fillStyle = C.purple; X.fillText('greet', gcx + 12, gcy + 24);
            X.fillStyle = C.tx; X.fillText('();', gcx + 12 + X.measureText('greet').width, gcy + 24);

            if (step === 4) {
                badge(gcx + 210, gcy + 12, '▶ Calling greet()', C.purpleL, C.purpleD, eOut(anim));
            }

            // NOT searched here
            if (wCrossed) {
                const ba2 = step === 7 ? eOut(anim) : 1;
                X.save(); X.globalAlpha = ba2;
                X.fillStyle = C.redL; X.strokeStyle = C.red + '60'; X.lineWidth = 1.5;
                rr(wX + 30, wY + 170, wW - 60, 80, 10); X.fill(); X.stroke();
                X.font = '600 14px "Segoe UI"'; X.fillStyle = C.redD; X.textAlign = 'center';
                X.fillText('✗ NOT searched here', wX + wW / 2, wY + 198);
                X.font = '400 13px "Segoe UI"'; X.fillStyle = C.md;
                X.fillText('wrapper() is the caller, not the', wX + wW / 2, wY + 220);
                X.fillText('lexical parent of greet()', wX + wW / 2, wY + 238);
                X.restore();
            }

            if (step === 3) {
                badge(wX + wW - 170, wY + wH - 30, '▶ Executing', C.greenL, C.greenD, eOut(anim));
            }

            // ── ARROWS ──

            // Call arrow: wrapper → greet
            if (step >= 4 && step <= 5) {
                const aa = step === 4 ? eOut(anim) : 1;
                const fxA = gcx + 200, fyA = gcy + 18;
                const txA = grX + grW, tyA = grY + 40;
                dashedArrow(fxA + 10, fyA, txA + 5, tyA, C.purple, aa, 3);
                X.save(); X.globalAlpha = aa;
                X.font = '600 13px "Segoe UI"'; X.fillStyle = C.purple; X.textAlign = 'center';
                X.fillText('calls', ((fxA + txA) / 2) + 10, Math.min(fyA, tyA) - 12);
                X.restore();
            }

            // Lookup arrow: greet → global variable (stays inside scope box, no overlap with title)
            if (step >= 8 && step <= 10) {
                const aa2 = step === 8 ? eOut(anim) : 1;
                // Arrow from top of greet box to the global variable pill
                const fxB = grX + grW / 2, fyB = grY;
                const txB = vbx + 110, tyB = vby + 28;

                // Curve that stays INSIDE the global scope box
                curvedDashedArrow(fxB, fyB - 2, txB, tyB,
                    fxB, gy + 50, txB, gy + 50,
                    C.green, aa2, 3);

                // Label inside the scope box, not overlapping title
                X.save(); X.globalAlpha = aa2;
                X.fillStyle = C.greenL; X.strokeStyle = C.green + '60'; X.lineWidth = 1.5;
                const labelW = 320, labelH = 30;
                const labelX = grX + grW / 2 - labelW / 2, labelY = gy + 52 - labelH / 2;
                rr(labelX, labelY, labelW, labelH, 6); X.fill(); X.stroke();
                X.font = '700 14px "Segoe UI"'; X.fillStyle = C.greenD; X.textAlign = 'center';
                X.fillText('⬆ Lexical lookup → Global Scope', grX + grW / 2, gy + 57);
                X.restore();
            }

            // Wrong path X
            if (step >= 7) {
                const xaB = step === 7 ? eOut(anim) : 1;
                X.save(); X.globalAlpha = xaB * .35;
                X.strokeStyle = C.red; X.lineWidth = 2; X.setLineDash([6, 8]);
                X.beginPath(); X.moveTo(grX + grW, grY + grH / 2); X.lineTo(wX, wY + wH / 2); X.stroke();
                X.setLineDash([]);
                const mx = (grX + grW + wX) / 2, my = (grY + grH / 2 + wY + wH / 2) / 2;
                X.strokeStyle = C.red; X.lineWidth = 4; X.globalAlpha = xaB * .7;
                X.beginPath(); X.moveTo(mx - 16, my - 16); X.lineTo(mx + 16, my + 16); X.stroke();
                X.beginPath(); X.moveTo(mx + 16, my - 16); X.lineTo(mx - 16, my + 16); X.stroke();
                X.restore();
            }

            X.restore();
        }

        /* ═══ OUTPUT CONSOLE ═══ */
        function drawOutput(a3) {
            const bx = 680, by = 870, bw = 440, bh = 100;
            X.save(); X.globalAlpha = a3;
            X.shadowColor = C.green; X.shadowBlur = 24;
            X.fillStyle = '#111827'; rr(bx, by, bw, bh, 12); X.fill();
            X.shadowBlur = 0;
            X.fillStyle = '#1f2937'; rr(bx, by, bw, 32, 12); X.fill(); X.fillRect(bx, by + 24, bw, 8);
            X.font = '500 12px "Segoe UI"'; X.fillStyle = C.lt; X.textAlign = 'left';
            X.fillText('Console Output', bx + 14, by + 21);
            X.font = '600 20px "SF Mono","Fira Code",Consolas,monospace';
            X.fillStyle = '#34d399';
            X.fillText('> "Hello, Global"', bx + 20, by + 68);
            badge(bx + bw + 16, by + 50, '✓ From Global Scope', C.greenL, C.greenD, a3);
            X.restore();
        }

        /* ═══ EXPLANATION PANEL ═══ */
        function drawExplanation(a4) {
            const ex = 80, ey = 640, ew = 530, eh = 320;
            X.save(); X.globalAlpha = a4;
            X.fillStyle = C.amberL; X.strokeStyle = C.amber + '50'; X.lineWidth = 1.5;
            rr(ex, ey, ew, eh, 14); X.fill(); X.stroke();

            X.font = '700 18px "Segoe UI"'; X.fillStyle = C.orangeD; X.textAlign = 'left';
            X.fillText('📖 Why "Global" and not "Wrapper"?', ex + 20, ey + 34);

            const pts = [
                'greet() is defined (written) in the Global Scope.',
                'When greet() needs a variable, it looks in its',
                'lexical environment — where it was written.',
                '',
                'wrapper() is the caller, but JavaScript uses',
                'lexical (static) scoping, not dynamic scoping.',
                '',
                'The scope chain is fixed at function creation time,',
                'not at call time.',
            ];

            X.font = '400 14px "Segoe UI"'; X.fillStyle = C.tx;
            pts.forEach((p, i) => {
                if (!p) return;
                const py = ey + 65 + i * 26;
                const da = eOut(clamp((a4 - .1 * i) * 2));
                X.save(); X.globalAlpha = a4 * da;
                X.fillText(p, ex + 24, py);
                X.restore();
            });
            X.restore();
        }

        /* ═══ COMPARISON TABLE ═══ */
        function drawComparison(a5) {
            const cx2 = 660, cy2 = 500, cw2 = 550, ch2 = 380;
            X.save(); X.globalAlpha = a5;

            X.fillStyle = '#f8fafc'; X.strokeStyle = C.gb; X.lineWidth = 1;
            rr(cx2, cy2, cw2, ch2, 14); X.fill(); X.stroke();

            X.font = '700 18px "Segoe UI"'; X.fillStyle = C.tx; X.textAlign = 'center';
            X.fillText('Lexical  vs  Dynamic Scoping', cx2 + cw2 / 2, cy2 + 34);

            const c1 = cx2 + 20, c2 = cx2 + cw2 / 2 + 10, cw3 = cw2 / 2 - 30;

            X.fillStyle = C.greenL; rr(c1, cy2 + 50, cw3, 32, 6); X.fill();
            X.font = '700 14px "SF Mono",Consolas,monospace'; X.fillStyle = C.greenD; X.textAlign = 'center';
            X.fillText('Lexical (JS)', c1 + cw3 / 2, cy2 + 72);

            X.fillStyle = C.redL; rr(c2, cy2 + 50, cw3, 32, 6); X.fill();
            X.fillStyle = C.redD; X.fillText('Dynamic', c2 + cw3 / 2, cy2 + 72);

            const rows = [
                ['Scope at write-time', 'Scope at call-time'],
                ['Predictable', 'Unpredictable'],
                ['greet() → Global', 'greet() → wrapper()'],
                ['Output: "Global"', 'Output: "Wrapper"'],
                ['✓ JavaScript uses this', '✗ Not JS behavior'],
            ];

            X.font = '400 13px "Segoe UI"'; X.textAlign = 'left';
            rows.forEach((row, i) => {
                const ry = cy2 + 100 + i * 48;
                const da2 = eOut(clamp((a5 - .08 * i) * 2.5));
                X.save(); X.globalAlpha = a5 * da2;

                X.fillStyle = i % 2 ? '#f8fafc' : '#fff';
                rr(c1, ry, cw3, 38, 4); X.fill();
                X.fillStyle = C.greenD; X.fillText(row[0], c1 + 10, ry + 25);

                X.fillStyle = i % 2 ? '#f8fafc' : '#fff';
                rr(c2, ry, cw3, 38, 4); X.fill();
                X.fillStyle = C.redD; X.fillText(row[1], c2 + 10, ry + 25);

                X.restore();
            });

            X.fillStyle = C.greenL; X.strokeStyle = C.green; X.lineWidth = 1.5;
            rr(c1, cy2 + ch2 - 50, cw3, 36, 8); X.fill(); X.stroke();
            X.font = '700 13px "Segoe UI"'; X.fillStyle = C.greenD; X.textAlign = 'center';
            X.fillText('✓ JavaScript', c1 + cw3 / 2, cy2 + ch2 - 27);

            X.fillStyle = C.redL; X.strokeStyle = C.red + '60'; X.lineWidth = 1;
            rr(c2, cy2 + ch2 - 50, cw3, 36, 8); X.fill(); X.stroke();
            X.font = '700 13px "Segoe UI"'; X.fillStyle = C.redD;
            X.fillText('✗ Not JavaScript', c2 + cw3 / 2, cy2 + ch2 - 27);

            X.restore();
        }

        /* ═══ TAKEAWAYS ═══ */
        function drawTakeaways(a6) {
            const kx = 1280, ky = 500, kw = 540, kh = 380;
            X.save(); X.globalAlpha = a6;

            X.fillStyle = C.purpleL; X.strokeStyle = C.purple + '40'; X.lineWidth = 1.5;
            rr(kx, ky, kw, kh, 14); X.fill(); X.stroke();

            X.font = '700 18px "Segoe UI"'; X.fillStyle = C.purpleD; X.textAlign = 'left';
            X.fillText('💡 Key Takeaways', kx + 20, ky + 34);

            const items = [
                { icon: '1️⃣', text: 'JavaScript uses lexical (static) scoping' },
                { icon: '2️⃣', text: 'Scope is determined at author time, not call time' },
                { icon: '3️⃣', text: 'A function\'s scope chain = where it is defined' },
                { icon: '4️⃣', text: 'Closures rely on lexical scoping to work' },
                { icon: '5️⃣', text: 'The call stack ≠ the scope chain' },
            ];

            items.forEach((it, i) => {
                const iy = ky + 65 + i * 56;
                const da3 = eOut(clamp((a6 - .1 * i) * 3));
                X.save(); X.globalAlpha = a6 * da3;

                X.fillStyle = '#fff'; rr(kx + 16, iy - 4, kw - 32, 44, 8); X.fill();
                X.font = '18px "Segoe UI"'; X.textAlign = 'left'; X.fillText(it.icon, kx + 28, iy + 22);
                X.font = '400 14px "Segoe UI"'; X.fillStyle = C.tx;
                X.fillText(it.text, kx + 58, iy + 21);

                X.restore();
            });

            X.fillStyle = C.blueL; X.strokeStyle = C.blue + '40'; X.lineWidth = 1;
            rr(kx + 16, ky + kh - 58, kw - 32, 44, 8); X.fill(); X.stroke();
            X.font = '500 13px "Segoe UI"'; X.fillStyle = C.blueD; X.textAlign = 'center';
            X.fillText('🧠 "Where was it written?" — that\'s the only question that matters.', kx + kw / 2, ky + kh - 30);

            X.restore();
        }

        /* ═══ MAIN RENDER ═══ */
        function render() {
            X.clearRect(0, 0, W, H); X.fillStyle = C.bg; X.fillRect(0, 0, W, H);
            const a = clamp(anim);

            // ── Scopes (drawn FIRST, behind title) ──
            if (step >= 2) {
                drawScopes(step === 2 ? eBack(a) : 1);
            }

            // ── Title (drawn ON TOP so nothing overlaps it) ──
            if (step >= 0) {
                // White backing strip to cleanly cover any scope content bleeding up
                X.save();
                X.fillStyle = C.bg;
                X.fillRect(0, 0, W, TITLE_BOTTOM);

                const ta = step === 0 ? eOut(a) : 1;
                X.globalAlpha = ta;
                X.font = '700 36px "Segoe UI",system-ui,sans-serif'; X.fillStyle = C.tx; X.textAlign = 'center';
                X.fillText('Lexical Scoping in JavaScript', W / 2, 56);
                X.font = '400 17px "Segoe UI"'; X.fillStyle = C.md;
                X.fillText('Scope is determined by where a function is written, not where it is called', W / 2, 86);
                X.strokeStyle = C.gb; X.lineWidth = 1;
                X.beginPath(); X.moveTo(500, 104); X.lineTo(1420, 104); X.stroke();
                X.restore();
            }

            // ── Code panel ──
            if (step >= 1) {
                X.save(); X.globalAlpha = step === 1 ? eOut(a) : 1;
                drawCode();
                X.restore();
            }

            // ── Lexical insight banner (step 5) ──
            if (step === 5) {
                const ba3 = eBack(a);
                const cardW = 760, cardH = 200;
                const bx2 = W / 2 - cardW / 2, by2 = H / 2 - cardH / 2;
                X.save(); X.globalAlpha = ba3;
                X.fillStyle = 'rgba(0,0,0,.4)'; X.fillRect(0, 0, W, H);

                X.shadowColor = C.amber; X.shadowBlur = 40;
                X.fillStyle = '#fff'; rr(bx2, by2, cardW, cardH, 20); X.fill();
                X.shadowBlur = 0;
                X.strokeStyle = C.amber; X.lineWidth = 3;
                rr(bx2, by2, cardW, cardH, 20); X.stroke();

                const centerX = bx2 + cardW / 2;

                X.font = '32px "Segoe UI"'; X.textAlign = 'center'; X.fillStyle = C.tx;
                X.fillText('💡', centerX, by2 + 48);

                X.font = '700 24px "Segoe UI"'; X.fillStyle = C.orangeD;
                X.fillText('Lexical Scoping Rule', centerX, by2 + 84);

                X.font = '500 18px "Segoe UI"'; X.fillStyle = C.tx;
                X.fillText('Scope is determined where the function is', centerX, by2 + 120);

                const writtenText = 'WRITTEN';
                const midText = ', not where it is ';
                const calledText = 'CALLED';
                const dotText = '.';

                X.font = '800 18px "Segoe UI"';
                const writtenW = X.measureText(writtenText).width;
                const calledW = X.measureText(calledText).width;
                X.font = '500 18px "Segoe UI"';
                const midW = X.measureText(midText).width;
                const dotW = X.measureText(dotText).width;

                const totalW = writtenW + midW + calledW + dotW;
                let drawX = centerX - totalW / 2;
                const lineY = by2 + 155;

                X.textAlign = 'left';

                X.font = '800 18px "Segoe UI"'; X.fillStyle = C.purple;
                X.fillText(writtenText, drawX, lineY);
                drawX += writtenW;

                X.font = '500 18px "Segoe UI"'; X.fillStyle = C.tx;
                X.fillText(midText, drawX, lineY);
                drawX += midW;

                X.font = '800 18px "Segoe UI"'; X.fillStyle = C.red;
                X.fillText(calledText, drawX, lineY);
                drawX += calledW;

                X.font = '500 18px "Segoe UI"'; X.fillStyle = C.tx;
                X.fillText(dotText, drawX, lineY);

                // Underlines
                X.save();
                const wStartX = centerX - totalW / 2;
                X.strokeStyle = C.purple; X.lineWidth = 2.5;
                X.beginPath(); X.moveTo(wStartX, lineY + 4); X.lineTo(wStartX + writtenW, lineY + 4); X.stroke();

                const cStartX = centerX - totalW / 2 + writtenW + midW;
                X.strokeStyle = C.red; X.lineWidth = 2.5;
                X.beginPath(); X.moveTo(cStartX, lineY + 4); X.lineTo(cStartX + calledW, lineY + 4); X.stroke();
                X.restore();

                X.restore();
            }

            // ── Output ──
            if (step >= 10 && step <= 11) {
                drawOutput(step === 10 ? eBack(a) : 1);
            }

            // ── Explanation ──
            if (step >= 11) {
                drawExplanation(step === 11 ? eOut(a) : 1);
            }

            // ── Comparison ──
            if (step >= 12) {
                drawComparison(step === 12 ? eOut(a) : 1);
            }

            // ── Takeaways ──
            if (step >= 13) {
                drawTakeaways(step === 13 ? eOut(a) : 1);
            }
        }

        let lastT = 0;
        function loop(ts) {
            const dt = (ts - lastT) / 1000; lastT = ts;
            anim = clamp(anim + dt * (1000 / AD));
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
