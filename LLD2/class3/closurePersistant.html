<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closures: Data Encapsulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app {
            width: 100%;
            max-width: 1120px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title */
        .hero {
            text-align: center;
            margin: 8px 0 10px;
            opacity: 0;
            transform: translateY(-14px);
        }

        .hero.vis {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s cubic-bezier(.25, .46, .45, .94);
        }

        .hero h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .hero p {
            font-size: 14px;
            color: #86868b;
            font-weight: 500;
            margin-top: 3px;
        }

        /* Stage */
        .stage {
            width: 100%;
            display: flex;
            gap: 18px;
            align-items: stretch;
            min-height: 500px;
            opacity: 0;
            transform: translateY(10px);
        }

        .stage.vis {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s cubic-bezier(.25, .46, .45, .94);
        }

        /* Code Panel */
        .code-panel {
            width: 380px;
            flex-shrink: 0;
            background: #1a1b26;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .code-top {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 11px 14px;
            background: #13141c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.r {
            background: #ff5f57;
        }

        .dot.y {
            background: #febc2e;
        }

        .dot.g {
            background: #28c840;
        }

        .code-fn {
            margin-left: auto;
            font-size: 11px;
            color: #565f89;
            font-family: 'SF Mono', monospace;
        }

        .code-body {
            flex: 1;
            padding: 14px 0;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12.5px;
            line-height: 1.8;
            color: #c0caf5;
            overflow: auto;
        }

        .cl {
            display: block;
            padding: 0 16px;
            border-left: 3px solid transparent;
            transition: background 0.3s, border-color 0.3s;
            white-space: pre;
            min-height: 22px;
        }

        .cl.hl {
            background: rgba(122, 162, 247, 0.07);
            border-left-color: #7aa2f7;
        }

        .cl.hl-g {
            background: rgba(158, 206, 106, 0.07);
            border-left-color: #9ece6a;
        }

        .cl.hl-w {
            background: rgba(224, 175, 104, 0.07);
            border-left-color: #e0af68;
        }

        .cl.hl-r {
            background: rgba(247, 118, 142, 0.07);
            border-left-color: #f7768e;
        }

        .cl.dim span {
            opacity: 0.3;
        }

        .ln {
            display: inline-block;
            width: 28px;
            text-align: right;
            padding-right: 14px;
            color: #3b4261;
            font-size: 11px;
            user-select: none;
        }

        /* Tokyo Night syntax */
        .sk {
            color: #bb9af7;
        }

        .sf {
            color: #7aa2f7;
        }

        .ss {
            color: #9ece6a;
        }

        .sv {
            color: #e0af68;
        }

        .sp {
            color: #565f89;
        }

        .sn {
            color: #ff9e64;
        }

        .so {
            color: #f7768e;
        }

        .sc {
            color: #7dcfff;
        }

        .sr {
            color: #bb9af7;
        }

        /* Visual Panel */
        .vis-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        /* Call Stack */
        .cs-wrap {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sec-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: #86868b;
            margin-bottom: 2px;
        }

        .cs-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
            min-height: 28px;
        }

        .cs-f {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'SF Mono', monospace;
            font-weight: 600;
            transition: all 0.35s cubic-bezier(.25, .46, .45, .94);
        }

        .cs-f.gl {
            background: #f2f2f7;
            color: #636366;
            border: 1px solid #e5e5ea;
        }

        .cs-f.cr {
            background: rgba(122, 162, 247, 0.08);
            color: #4a6fbf;
            border: 1px solid rgba(122, 162, 247, 0.2);
        }

        .cs-f.fn {
            background: rgba(158, 206, 106, 0.08);
            color: #3a7a28;
            border: 1px solid rgba(158, 206, 106, 0.2);
        }

        /* Memory Boxes */
        .mem-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mb {
            flex: 1;
            min-width: 170px;
            border-radius: 12px;
            padding: 12px 14px;
            transition: all 0.5s cubic-bezier(.25, .46, .45, .94);
        }

        .mb.gl-mem {
            background: #f8f8fa;
            border: 1.5px solid #e0e0e5;
        }

        .mb.cr-mem {
            background: linear-gradient(135deg, rgba(122, 162, 247, 0.05), rgba(122, 162, 247, 0.01));
            border: 1.5px solid rgba(122, 162, 247, 0.18);
        }

        .mb.cl-mem {
            background: linear-gradient(135deg, rgba(224, 175, 104, 0.06), rgba(224, 175, 104, 0.01));
            border: 1.5px solid rgba(224, 175, 104, 0.22);
        }

        .mb.shield-mem {
            background: linear-gradient(135deg, rgba(247, 118, 142, 0.04), rgba(247, 118, 142, 0.01));
            border: 1.5px solid rgba(247, 118, 142, 0.18);
        }

        .mb-t {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 6px;
        }

        .mb-t.t-g {
            color: #86868b;
        }

        .mb-t.t-c {
            color: #5b7ec9;
        }

        .mb-t.t-cl {
            color: #b8942a;
        }

        .mb-t.t-sh {
            color: #d25a6a;
        }

        .mr {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-family: 'SF Mono', monospace;
            font-size: 11.5px;
        }

        .mk {
            color: #007aff;
            font-weight: 600;
        }

        .mv {
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.025);
        }

        .mv.fn {
            color: #af52de;
            font-style: italic;
            font-size: 11px;
        }

        .mv.str {
            color: #ff9500;
        }

        .mv.num {
            color: #ff3b30;
            font-weight: 700;
        }

        .mv.undef {
            color: #8e8e93;
            font-style: italic;
        }

        .mv.flash {
            background: rgba(52, 199, 89, 0.1);
            color: #248a3d;
            box-shadow: 0 0 6px rgba(52, 199, 89, 0.15);
        }

        .mv.flash-r {
            background: rgba(247, 118, 142, 0.1);
            color: #d25a6a;
            box-shadow: 0 0 6px rgba(247, 118, 142, 0.15);
        }

        .mb-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 6px;
        }

        .mb-badge.bk {
            background: rgba(224, 175, 104, 0.1);
            border: 1px solid rgba(224, 175, 104, 0.2);
            color: #b8942a;
        }

        .mb-badge.shield {
            background: rgba(247, 118, 142, 0.08);
            border: 1px solid rgba(247, 118, 142, 0.18);
            color: #d25a6a;
        }

        .mb-badge.priv {
            background: rgba(52, 199, 89, 0.08);
            border: 1px solid rgba(52, 199, 89, 0.18);
            color: #248a3d;
        }

        .mb.pulse-search {
            animation: searchPulse 0.8s ease infinite;
        }

        @keyframes searchPulse {

            0%,
            100% {
                box-shadow: inset 0 0 0 1.5px rgba(0, 122, 255, 0.2);
            }

            50% {
                box-shadow: inset 0 0 0 1.5px rgba(0, 122, 255, 0.05);
            }
        }

        .mb.found-glow {
            box-shadow: inset 0 0 0 1.5px rgba(52, 199, 89, 0.25);
        }

        /* Console */
        .con-box {
            background: #1a1b26;
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #24283b;
            min-height: 32px;
        }

        .con-t {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #3b4261;
            margin-bottom: 4px;
        }

        .con-line {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            padding: 2px 0;
        }

        .con-line .chv {
            color: #3b4261;
            margin-right: 6px;
        }

        .con-line.ok {
            color: #9ece6a;
        }

        .con-line.err {
            color: #f7768e;
        }

        /* Narrator */
        .narrator {
            width: 100%;
            margin-top: 8px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #f8f8fa;
            border: 1px solid #e5e5ea;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            min-height: 52px;
        }

        .n-ico {
            font-size: 17px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .n-txt {
            font-size: 13.5px;
            line-height: 1.55;
            color: #1d1d1f;
            font-weight: 430;
        }

        .n-txt .hb {
            color: #007aff;
            font-weight: 600;
        }

        .n-txt .hg {
            color: #248a3d;
            font-weight: 600;
        }

        .n-txt .hw {
            color: #b8942a;
            font-weight: 600;
        }

        .n-txt .hr {
            color: #d25a6a;
            font-weight: 600;
        }

        .n-txt code {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.04);
            padding: 1px 5px;
            border-radius: 4px;
        }

        /* Privacy wall visual */
        .priv-wall {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            background: repeating-linear-gradient(45deg,
                    rgba(247, 118, 142, 0.04),
                    rgba(247, 118, 142, 0.04) 8px,
                    transparent 8px,
                    transparent 16px);
            border: 1.5px dashed rgba(247, 118, 142, 0.25);
            font-size: 11px;
            font-family: 'SF Mono', monospace;
            color: #d25a6a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            background: #fafafa;
            border-radius: 14px;
            border: 1px solid #e5e5ea;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.03);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 7px 13px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn svg {
            width: 12px;
            height: 12px;
        }

        .b-prev {
            background: #fff;
            color: #1d1d1f;
            border: 1.5px solid #d1d1d6;
        }

        .b-prev:hover:not(:disabled) {
            background: #f2f2f7;
        }

        .b-next {
            background: #007aff;
            color: #fff;
        }

        .b-next:hover:not(:disabled) {
            background: #0066d6;
        }

        .b-play {
            background: #34c759;
            color: #fff;
        }

        .b-play:hover:not(:disabled) {
            background: #2db84d;
        }

        .b-play.pau {
            background: #ff9500;
        }

        .b-play.pau:hover:not(:disabled) {
            background: #e68600;
        }

        .b-stop {
            background: #ff3b30;
            color: #fff;
        }

        .b-stop:hover:not(:disabled) {
            background: #e0352b;
        }

        .b-rst {
            background: #fff;
            color: #8e8e93;
            border: 1.5px solid #d1d1d6;
        }

        .b-rst:hover:not(:disabled) {
            background: #f2f2f7;
            color: #1d1d1f;
        }

        .cdv {
            width: 1px;
            height: 22px;
            background: #d1d1d6;
        }

        .dots {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .dt {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d1d1d6;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dt:hover {
            background: #a0a0a5;
        }

        .dt.on {
            background: #007aff;
            box-shadow: 0 0 5px rgba(0, 122, 255, 0.35);
            transform: scale(1.35);
        }

        .dt.dn {
            background: #34c759;
        }

        .sn-txt {
            font-size: 11px;
            font-weight: 600;
            color: #8e8e93;
            min-width: 46px;
            font-variant-numeric: tabular-nums;
        }

        .chip {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 3px 8px;
            border-radius: 5px;
            min-width: 64px;
            text-align: center;
            background: rgba(0, 0, 0, 0.03);
            color: #8e8e93;
        }

        .chip.pl {
            color: #34c759;
            background: rgba(52, 199, 89, 0.08);
        }

        .chip.pa {
            color: #ff9500;
            background: rgba(255, 149, 0, 0.08);
        }

        .chip.co {
            color: #007aff;
            background: rgba(0, 122, 255, 0.08);
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="hero" id="hero">
            <h1>Closures: Data Encapsulation</h1>
            <p>Building a private counter — piece by piece</p>
        </div>

        <div class="stage" id="stage">
            <div class="code-panel">
                <div class="code-top">
                    <div class="dot r"></div>
                    <div class="dot y"></div>
                    <div class="dot g"></div>
                    <span class="code-fn">counter.js</span>
                </div>
                <div class="code-body" id="codeBody"></div>
            </div>
            <div class="vis-panel">
                <div class="cs-wrap">
                    <div class="sec-label">Call Stack</div>
                    <div class="cs-stack" id="cs"></div>
                </div>
                <div class="sec-label">Memory & Closures</div>
                <div class="mem-area" id="mem"></div>
                <div class="con-box">
                    <div class="con-t">Console</div>
                    <div id="con"></div>
                </div>
            </div>
        </div>

        <div class="narrator" id="nar">
            <span class="n-ico">💡</span>
            <div class="n-txt" id="narTxt">Press <span class="hb">Next</span> or <span class="hb">Play</span> to begin.
            </div>
        </div>

        <div class="controls">
            <button class="btn b-prev" id="bP" disabled>
                <svg viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M11.7 1.3a1 1 0 010 1.4L6.4 8l5.3 5.3a1 1 0 01-1.4 1.4l-6-6a1 1 0 010-1.4l6-6a1 1 0 011.4 0z" />
                </svg>Prev
            </button>
            <button class="btn b-next" id="bN">Next
                <svg viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M4.3 1.3a1 1 0 011.4 0l6 6a1 1 0 010 1.4l-6 6a1 1 0 01-1.4-1.4L9.6 8 4.3 2.7a1 1 0 010-1.4z" />
                </svg>
            </button>
            <div class="cdv"></div>
            <button class="btn b-play" id="bA">
                <svg viewBox="0 0 16 16" fill="currentColor" id="pI">
                    <path d="M4 2.5v11a.5.5 0 00.77.42l9-5.5a.5.5 0 000-.84l-9-5.5A.5.5 0 004 2.5z" />
                </svg>
                <span id="pL">Play</span>
            </button>
            <button class="btn b-stop" id="bS" disabled>
                <svg viewBox="0 0 16 16" fill="currentColor">
                    <rect x="3" y="3" width="10" height="10" rx="1.5" />
                </svg>Stop
            </button>
            <button class="btn b-rst" id="bR">
                <svg viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 1.5A6.5 6.5 0 001.5 8H0l2.5 3L5 8H3a5 5 0 11.77 2.66l-1.34 1A6.5 6.5 0 108 1.5z" />
                </svg>Reset
            </button>
            <div class="cdv"></div>
            <div class="dots" id="dots"></div>
            <span class="sn-txt" id="sNum">0 / 18</span>
            <div class="cdv"></div>
            <span class="chip" id="chip">READY</span>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const T = 18;
        let c = 0, tm = null, pl = false, pa = false;

        const codeLines = [
            [1, [['sk', 'function'], ['sp', ' '], ['sf', 'createCounter'], ['sp', '() {']]],
            [2, [['sp', '  '], ['sk', 'let'], ['sp', ' '], ['sv', 'count'], ['sp', ' = '], ['sn', '0'], ['sp', ';']]],
            [3, [['sp', '']]],
            [4, [['sp', '  '], ['sr', 'return'], ['sp', ' '], ['sk', 'function'], ['sp', '() {']]],
            [5, [['sp', '    '], ['sv', 'count'], ['sp', ' = '], ['sv', 'count'], ['sp', ' + '], ['sn', '1'], ['sp', ';']]],
            [6, [['sp', '    '], ['so', 'console'], ['sp', '.'], ['sc', 'log'], ['sp', '('], ['ss', '"Called "'], ['sp', ' + '], ['sv', 'count'], ['sp', ' + '], ['ss', '" times"'], ['sp', ');']]],
            [7, [['sp', '  '], ['sp', '};']]],
            [8, [['sp', '}']]],
            [9, [['sp', '']]],
            [10, [['sk', 'const'], ['sp', ' '], ['sv', 'counter'], ['sp', ' = '], ['sf', 'createCounter'], ['sp', '();']]],
            [11, [['sp', '']]],
            [12, [['sf', 'counter'], ['sp', '();']]],
            [13, [['sf', 'counter'], ['sp', '();']]],
            [14, [['sf', 'counter'], ['sp', '();']]],
        ];

        function buildCode() {
            $('codeBody').innerHTML = codeLines.map(([n, tks]) => {
                let h = `<span class="ln">${n}</span>`;
                tks.forEach(([cls, txt]) => { h += cls ? `<span class="${cls}">${txt.replace(/</g, '&lt;')}</span>` : txt; });
                return `<div class="cl" data-l="${n}">${h}</div>`;
            }).join('');
        }

        function buildDots() {
            $('dots').innerHTML = '';
            for (let i = 1; i <= T; i++) {
                const d = document.createElement('div');
                d.className = 'dt'; d.title = `Step ${i}`;
                d.onclick = () => go(i);
                $('dots').appendChild(d);
            }
        }

        function hlC() { document.querySelectorAll('.cl').forEach(l => { l.className = 'cl'; }); }
        function hlL(n, cls = 'hl') { hlC(); if (n) { const e = document.querySelector(`.cl[data-l="${n}"]`); if (e) e.classList.add(cls); } }
        function hlR(a, b, cls = 'hl') { hlC(); for (let i = a; i <= b; i++) { const e = document.querySelector(`.cl[data-l="${i}"]`); if (e) e.classList.add(cls); } }
        function dimAll(ex) { document.querySelectorAll('.cl').forEach(l => l.classList.add('dim')); ex.forEach(n => { const e = document.querySelector(`.cl[data-l="${n}"]`); if (e) e.classList.remove('dim'); }); }

        function setCS(frames) {
            $('cs').innerHTML = frames.map(f => `<div class="cs-f ${f.c}">${f.l}</div>`).join('');
        }

        function setMem(boxes) {
            $('mem').innerHTML = boxes.map(b => {
                let h = `<div class="mb-t ${b.tc}">${b.t}</div>`;
                (b.rows || []).forEach(r => {
                    h += `<div class="mr"><span class="mk">${r.k}</span><span class="mv ${r.vc || ''}">${r.v}</span></div>`;
                });
                (b.badges || []).forEach(bd => { h += `<div class="mb-badge ${bd.c}">${bd.t}</div>`; });
                if (b.wall) {
                    h += `<div class="priv-wall">${b.wall}</div>`;
                }
                return `<div class="mb ${b.c} ${b.ex || ''}">${h}</div>`;
            }).join('');
        }

        function setCon(lines) {
            $('con').innerHTML = lines.map(l =>
                `<div class="con-line ${l.c || 'ok'}"><span class="chv">❯</span>${l.t}</div>`
            ).join('');
        }

        function setN(html, ico = '💡') {
            $('nar').querySelector('.n-ico').textContent = ico;

        function go(s) {
            c = Math.max(0, Math.min(T, s));
            if (c === 0) { apply(0); } else { apply(c); }
            updUI();
        }

        function updUI() {
            $('bP').disabled = c <= 0;
            $('bN').disabled = c >= T;
            $('sNum').textContent = `${c} / ${T}`;
            [...$('dots').children].forEach((d, i) => {
                d.classList.remove('on', 'dn');
                if (i + 1 < c) d.classList.add('dn');
                else if (i + 1 === c) d.classList.add('on');
            });
            const ch = $('chip');
            ch.className = 'chip';
            if (pl && !pa) { ch.textContent = 'PLAYING'; ch.classList.add('pl'); }
            else if (pl && pa) { ch.textContent = 'PAUSED'; ch.classList.add('pa'); }
            else if (c >= T) { ch.textContent = 'COMPLETE'; ch.classList.add('co'); }
            else if (c === 0) ch.textContent = 'READY';
            else ch.textContent = `STEP ${c}`;

            const pb = $('bA'); pb.classList.remove('pau');
            if (pl && !pa) {
                $('pL').textContent = 'Pause'; pb.classList.add('pau');
                $('pI').innerHTML = '<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>';
            } else {
                $('pL').textContent = 'Play';
                $('pI').innerHTML = '<path d="M4 2.5v11a.5.5 0 00.77.42l9-5.5a.5.5 0 000-.84l-9-5.5A.5.5 0 004 2.5z"/>';
            }
            $('bS').disabled = !pl;
        }

        function autoP() {
            clearInterval(tm);
            tm = setInterval(() => {
                if (c < T) go(c + 1);
                else { clearInterval(tm); pl = false; pa = false; updUI(); }
            }, 2400);
        }

        $('bN').onclick = () => { if (c < T) go(c + 1); };
        $('bP').onclick = () => { if (c > 0) go(c - 1); };
        $('bA').onclick = () => {
            if (pl && !pa) { pa = true; clearInterval(tm); updUI(); return; }
            if (pl && pa) { pa = false; autoP(); updUI(); return; }
            if (c >= T) { c = 0; apply(0); }
            pl = true; pa = false; autoP(); updUI();
        };
        $('bS').onclick = () => { clearInterval(tm); pl = false; pa = false; updUI(); };
        $('bR').onclick = () => { clearInterval(tm); pl = false; pa = false; c = 0; apply(0); updUI(); };

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (c < T) go(c + 1); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); if (c > 0) go(c - 1); }
            if (e.key.toLowerCase() === 'r') $('bR').click();
            if (e.key.toLowerCase() === 'p') $('bA').click();
            if (e.key.toLowerCase() === 's') $('bS').click();
        });

        buildCode(); buildDots(); updUI(); apply(0);
